<svg viewBox="0 0 640 944" role="img" aria-labelledby="st-title st-desc" class="d-statuses">
<title id="st-title">Order status lifecycle</title>
<desc id="st-desc">The normal path runs from Pending (1) through Pickup requested (2), Assigned for pickup (3), Picked (4), At first-mile hub (7), sorting at a sorting hub, the central warehouse or a sub-sort centre (8 to 11, 35, 38, 39), At last-mile hub (12, 13) and Assigned for delivery (14) to Delivered (15). A pickup can be put on hold or cancelled (5, 6). From Assigned for delivery a parcel can go on hold and be tried again (16), be partly delivered or exchanged (18, 22), be lost or damaged (20, 19), or be returned (17, 21); a return travels back through the hubs (23 to 31, 34, 40, 41) and ends Returned to merchant (32). Reverse pickup (42 to 45) is a separate flow; a lost parcel can be found (36) or reprocessed (37).</desc>
<defs><marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>

<g><rect class="d-box d-main" x="16" y="88" width="300" height="48" rx="10"/><text class="d-t" x="30" y="109">Pickup requested</text><text class="d-n" x="30" y="127">2</text></g>
<g><rect class="d-box d-main" x="16" y="160" width="300" height="48" rx="10"/><text class="d-t" x="30" y="181">Assigned for pickup</text><text class="d-n" x="30" y="199">3</text></g>
<g><rect class="d-box d-main" x="16" y="232" width="300" height="48" rx="10"/><text class="d-t" x="30" y="253">Picked</text><text class="d-n" x="30" y="271">4</text></g>
<g><rect class="d-box d-main" x="16" y="304" width="300" height="48" rx="10"/><text class="d-t" x="30" y="325">At first-mile hub</text><text class="d-n" x="30" y="343">7</text></g>
<g><rect class="d-box d-main" x="16" y="376" width="300" height="48" rx="10"/><text class="d-t" x="30" y="397">Sorting hub, central or sub-sort</text><text class="d-n" x="30" y="415">8–11, 35, 38, 39</text></g>
