<svg viewBox="0 0 640 608" role="img" aria-labelledby="mw-title mw-desc">
<title id="mw-title">Money waterfall for one COD parcel</title>
<desc id="mw-desc">The COD amount collected from the buyer, minus the delivery fee, minus the COD fee, plus or minus compensation and adjustments, gives the seller payout. Below it, the hub deposit formula: payable equals sum collected minus money lost, cash in hand and withdrawn expenses, plus carry.</desc>
<text class="d-t" x="40" y="32">COD collected from the buyer</text>
<text class="d-n" x="40" y="50">the full amount the rider collects</text>
<rect class="d-box d-ok" x="40" y="60" width="560" height="26" rx="6"/>
<text class="d-t" x="40" y="124">− Delivery fee</text>
<text class="d-n" x="40" y="142">by destination zone and weight</text>
<rect class="d-box d-bad" x="480" y="152" width="120" height="26" rx="6"/>
<text class="d-t" x="40" y="216">− COD fee</text>
<text class="d-n" x="40" y="234">a percentage of the amount collected</text>
<rect class="d-box d-bad" x="440" y="244" width="40" height="26" rx="6"/>
<text class="d-t" x="40" y="308">± Compensation and adjustments</text>
<text class="d-n" x="40" y="326">lost or damaged parcels, return fees, extras</text>
<rect class="d-box d-alt" x="410" y="336" width="30" height="26" rx="6"/>
<text class="d-t" x="40" y="400">= Seller payout</text>
<text class="d-n" x="40" y="418">paid by bank or MFS wallet</text>
<rect class="d-box d-main" x="40" y="428" width="370" height="26" rx="6"/>
<line class="d-line d-dash" x1="410" y1="16" x2="410" y2="456"/>
<rect class="d-box d-main" x="16" y="480" width="608" height="112" rx="10"/>
<text class="d-t" x="32" y="508">Hub deposit (payable)</text>
<text class="d-n d-ink" x="32" y="536">payable = sum collected</text>
<text class="d-n d-ink" x="32" y="558">  − (money lost + cash in hand + withdrawn expenses)</text>
<text class="d-n d-ink" x="32" y="580">  + carry</text>
</svg>
<figcaption>Where one COD parcel's cash goes (bars not to scale), and the hub deposit formula from <code>hub-payment-submission-form.tsx</code>.</figcaption>
